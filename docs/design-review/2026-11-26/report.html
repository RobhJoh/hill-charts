rivas?","why":"Raden blandar enheter: \"4 dagar kvar av 8 veckor\" men \"22 dagar kvar av 108 dagar\".","findings":["nedrakning-blandade-enheter"],"options":[{"key":"a","label":"Bara dagar kvar","detail":"\"4 dagar kvar\"; stapeln visar andelen och Appetiten står på sidan."},{"key":"b","label":"Samma enhet på båda sidor","detail":"\"4 dagar kvar av 56\"; hela informationen i en enhet.","recommended":true},{"key":"c","label":"Som specen","detail":"Behåll \"N dagar kvar av X veckor\" och acceptera blandningen."}]},{"id":"Q7","round":0,"theme":"Historik","question":"Var ska \"Återställ hit\" ligga?","why":"Varje Historik-rad har Återställ hit, som skriver om hela diagrammet med ett klick utan Ångra-toast.","findings":["projekt-historik-knappvagg"],"options":[{"key":"a","label":"Bara i Visa-bannern","detail":"Raderna får Visa och Ångra bara denna; man ser alltid läget innan man återställer.","recommended":true,"mockup":"mockups/Q7/a.html"},{"key":"b","label":"Kvar på raden, med Ångra-toast","detail":"Snabbast; \"Diagrammet återställt · Ångra\" efteråt, knapparna visas vid hover och fokus.","mockup":"mockups/Q7/b.html"}]},{"id":"Q8","round":0,"theme":"Projekt","question":"Hur stängt ska ett Avslutat Projekt kännas?","why":"Ett Avslutat Projekt ser ut och beter sig som ett pågående: samma diagram, dragbara stjärnor och röd \"Ny Scope\".","findings":["projekt-avslutat-ser-pagaende-ut"],"options":[{"key":"a","label":"Dämpat men redigerbart","detail":"Stjärnorna dimmas, \"Öppna igen\" blir primär, dra fungerar fortfarande.","recommended":true,"mockup":"mockups/Q8/a.html"},{"key":"b","label":"Skrivskyddat tills Öppna igen","detail":"Tydligast avslut; ett klick extra för att justera i efterhand.","mockup":"mockups/Q8/b.html"}]},{"id":"Q9","round":0,"theme":"Telefon","question":"Hur ska Hill chart och Stjärnkarta se ut på telefon?","why":"Diagrammet skalas ner från 900 enheter: etiketterna blir 6–7 px och stjärnorna 13 px att träffa.","findings":["projekt-telefon-diagram-for-litet","stjarnkarta-telefon-for-liten"],"options":[{"key":"a","label":"Egen telefonruta i riktiga pixlar","detail":"Ritas för telefonbredden med 13 px etiketter och 44 px träffytor; nyckel och lista under.","recommended":true,"mockup":"mockups/Q9/a.html"},{"key":"b","label":"Bara vald stjärnas etikett","detail":"Som embedden: listan bär namnen, tryck på en stjärna för att se dess etikett.","mockup":"mockups/Q9/b.html"}]},{"id":"Q10","round":0,"theme":"Scope-listan","question":"Hur byts Ägare och hur når man Stjärnkartan från listan?","why":"Ägare är en genomskinlig select och Stjärnkartan ett ensamt ✦ på egen rad.","findings":["projekt-agare-cell-tva-rader"],"options":[{"key":"a","label":"Namnet är länk, Byt Ägare i åtgärdsraden","detail":"Namnet leder till Stjärnkartan; byte görs från vald rad bredvid Byt namn och Ta bort.","recommended":true,"mockup":"mockups/Q10/a.html"},{"key":"b","label":"Select kvar, Stjärnkarta i åtgärdsraden","detail":"Snabbt byte direkt i listan; \"✦ Stjärnkarta\" flyttas till vald rad.","mockup":"mockups/Q10/b.html"}]},{"id":"Q11","round":1,"theme":"Översiktens Projektceller","question":"Hur ska Avslutade Projekt visas i Funktionsområdets cell och sida?","why":"Du har rätt: ett Avslutat Projekt står på 100, så dess minikarta säger inget nytt och den tonade cellen blir bara svårläst (ca 2,9:1). Därför försvinner minikartan i alla varianter; frågan är hur listan ser ut.","findings":["avslutat-for-lag-kontrast"],"options":[{"key":"a","label":"Lista \"Avslutade\" med ljusblå ✦","detail":"Avslutade samlas sist i en tät lista: ljusblå ✦, namn och \"Avslutat 12 nov.\". Full kontrast (namn ca 12:1, datum ca 6:1). Pågående celler först, oförändrade.","mockup":"mockups/Q11/a.html","recommended":true},{"key":"b","label":"Hopfälld \"Avslutade (1) ▸\"","detail":"Samma lista men stängd tills man trycker. Minst brus, men Avslutade syns inte alls vid en snabb titt.","mockup":"mockups/Q11/b.html"},{"key":"c","label":"Egen cell utan minikarta","detail":"Avslutade behåller sin plats i rutnätet som en låg cell: ljusblå ✦, namn och datum. Ordningen blir som i Q4 c, men cellerna tar mer plats än en lista.","mockup":"mockups/Q11/c.html"}]},{"id":"Q12","round":1,"theme":"Stjärnkarta","question":"Ska Avslutade Projekt synas på Stjärnkartan och bland grannprojekten?","why":"Nej, inte på Stjärnkartan: en stjärna på 100 kräver inget av Ägaren, och utan Avslutade behövs filterraden inte alls. I Projektets sidomeny kan de däremot vara bra som väg tillbaka.","findings":["stjarnkarta-filter-ett-val","projekt-grannar-avslutat-utan-ord"],"options":[{"key":"a","label":"Aldrig på kartan; sist i sidomenyn med ✦","detail":"Stjärnkartan visar bara pågående, filterraden tas bort. Sidomenyn \"Andra Projekt i Kundupplevelse\" listar Avslutade sist med ljusblå ✦ och ordet \"Avslutat\" i full kontrast.","mockup":"mockups/Q12/a.html","recommended":true},{"key":"b","label":"Aldrig på kartan och aldrig i sidomenyn","detail":"Renast: bara pågående överallt utom Funktionsområdets lista. Vägen till ett Avslutat Projekt går via Funktionsområdet.","mockup":"mockups/Q12/b.html"}]},{"id":"Q13","round":1,"theme":"Accentfärg och kontrast","question":"Hur ska primärknappen se ut med den orangeröda accenten?","why":"Q1 blev ny kulör och kontrastfix. I dag ger vit text på #e0503a 3,9:1, under kravet 4,5:1, och en mer orange kulör med vit text sjunker till ca 3,3:1. Så antingen blir texten mörk, kulören mörkare, eller knappen en kontur.","findings":["primarknapp-kontrast"],"options":[{"key":"a","label":"Ljus orangeröd, mörk text","detail":"Natt: #f0602e med text #081026, 5,8:1. Dag: #c44a1c med vit text, 4,8:1. Starkast lyster, samma kulör som stilla-ringen.","mockup":"mockups/Q13/a.html","recommended":true},{"key":"b","label":"Mörkare orangeröd, vit text","detail":"Natt och dag: #b8401a med vit text, 5,5:1. Vit text som i dag, men knappen blir tyngre och mindre orange i natt.","mockup":"mockups/Q13/b.html"},{"key":"c","label":"Konturknapp","detail":"Natt: transparent med 1,5 px ram och text #ff8a5c, 8,1:1 mot bakgrunden. Lugnast, men primärhandlingen sticker inte ut lika tydligt.","mockup":"mockups/Q13/c.html"}]},{"id":"Q14","round":1,"theme":"Embed: läsa kullen","question":"Vad ska kullens två halvor heta?","why":"Shape Up kallar dem \"figuring things out\" (uppför: okända delar, man vet inte än hur) och \"making it happen\" (nedför: allt är känt, det återstår att göra). Texterna står under baslinjen i Hill chart och i embedden när rutan är högre än 150 px.","findings":["embed-uppfor-nedfor-saknas"],"options":[{"key":"a","label":"Utforskar · Genomför","detail":"Korta verb som säger vad teamet gör. Nära Shape Ups mening och ryms även i smal embed.","mockup":"mockups/Q14/a.html","recommended":true},{"key":"b","label":"Lista ut · Göra klart","detail":"Närmast Shape Ups egna ord, vardagligt. Något längre, och \"Göra klart\" kan läsas som \"nästan klar\".","mockup":"mockups/Q14/b.html"},{"key":"c","label":"Okänt · Känt","detail":"Beskriver läget i stället för arbetet: vänster har okända delar, höger bara kända. Kortast, men kräver att man kan modellen.","mockup":"mockups/Q14/c.html"}]},{"id":"Q15","round":1,"theme":"Accentfärg och kontrast","question":"Ska vald stjärna märkas med Apogees ✦?","why":"Ja, det går och löser krocken bättre än färg: ✦ är en form, så den skiljer sig från rampens orange oavsett kulör. Den kan stå i etiketten eller ersätta ringen.","findings":["projekt-accent-krockar-med-uppfor"],"options":[{"key":"a","label":"✦ före namnet i etiketten, heldragen ring","detail":"Vald: heldragen 2 px ring i accent och \"✦ Sessionshantering\" i etiketten och listan. Stilla behåller sin streckade ring med mörk halo.","mockup":"mockups/Q15/a.html","recommended":true},{"key":"b","label":"✦ ovanför stjärnan, ingen ring","detail":"Ett litet ✦ i accent svävar ovanför vald stjärna. Ingen ring alls för vald, så bara stilla har ring. Renast, men ✦ kan krocka med etiketter ovanför.","mockup":"mockups/Q15/b.html"},{"key":"c","label":"Bara ring, ingen ✦","detail":"Som rapportens förslag: heldragen ring för vald, streckad med halo för stilla. Ingen ny symbol.","mockup":"mockups/Q15/c.html"}]},{"id":"Q16","round":1,"theme":"Sidhuvud","question":"Hur ska sidhuvudet se ut på telefon när en Signatur är satt?","why":"Sidhuvudet blir 457 px på en 390 px skärm, så hela sidan glider i sidled. Märket, Signaturen och kugghjulet måste rymmas på en rad.","findings":["header-telefon-for-brett"],"options":[{"key":"a","label":"Initialer som meny","detail":"Märke, knapp \"AL\" och kugghjul. \"AL\" öppnar en meny med Mina Scopes, Byt Signatur och tema. Sidan blir exakt 390 px.","mockup":"mockups/Q16/a.html","recommended":true},{"key":"b","label":"Två rader","detail":"Rad 1: märke och kugghjul. Rad 2: \"Anna Lind · Mina Scopes\". Allt syns direkt, men sidhuvudet tar ca 40 px mer höjd.","mockup":"mockups/Q16/b.html"}]},{"id":"Q17","round":1,"theme":"Hill chart på telefon","question":"Hur mycket ska Hill chart och Stjärnkarta visa på telefon?","why":"Q9 a ger en egen telefonruta med 13 px etiketter och 44 px träffytor. Kvar är om alla etiketter ska stå framme, och samma 44 px gäller knappar och nyckelrader på Personer och Stjärnkartan (i dag 18–27 px).","findings":["projekt-telefon-diagram-for-litet","stjarnkarta-telefon-for-liten","personer-knappar-for-sma-telefon"],"options":[{"key":"a","label":"Alla etiketter upp till 4, sedan bara vald","detail":"Med fler än fyra stjärnor visas bara vald stjärnas etikett; listan under bär namnen. Träffytor 44 px överallt.","mockup":"mockups/Q17/a.html","recommended":true},{"key":"b","label":"Alltid alla etiketter","detail":"Etiketterna i 13 px staplas med ledarlinjer. Allt syns utan tryck, men rutan blir ca 1,5 gånger högre med 6 Scopes.","mockup":"mockups/Q17/b.html"}]},{"id":"Q18","round":1,"theme":"Handlingar i sidhuvudet","question":"Vad ska stå framme i Funktionsområdets sidhuvud?","why":"Q5 a lägger Byt namn, Kopiera länk och Ta bort i en Mer-meny. Kvar är om tidsplanens Ändra datum och Ny Milstolpe också ska in där, och vad telefonen visar först.","findings":["fo-sidhuvud-for-manga-handlingar"],"options":[{"key":"a","label":"Mer-meny för sällsynta; tidsplan och Nytt Projekt kvar","detail":"Framme: \"Nytt Projekt\", \"Ändra datum\", \"Ny Milstolpe\". På telefon: rubrik, status och nedräkning först, Projekten börjar ca 200 px ned i stället för 380.","mockup":"mockups/Q18/a.html","recommended":true},{"key":"b","label":"Allt utom Nytt Projekt i Mer-menyn","detail":"Bara \"Nytt Projekt\" och \"Mer\" framme. Lugnast, men tidsplanen ändras genom en meny.","mockup":"mockups/Q18/b.html"}]},{"id":"Q19","round":1,"theme":"Hill chart på telefon","question":"Var ska hjälptexten om att dra stjärnor stå?","why":"I dag står den under färgskalan, på telefon ca 700 px under diagrammet, och nämner piltangenter.","findings":["projekt-hjalptext-fel-plats"],"options":[{"key":"a","label":"Direkt under diagrammet, anpassad","detail":"\"Dra en stjärna längs banan för att ändra dess Läge.\" På dator läggs till \"Markera och använd piltangenterna (Shift = 10 steg).\"","mockup":"mockups/Q19/a.html","recommended":true},{"key":"b","label":"En ?-knapp vid diagrammet","detail":"Texten öppnas från en liten \"?\" i diagrammets hörn. Renare, men nya användare ser den inte.","mockup":"mockups/Q19/b.html"}]},{"id":"Q20","round":1,"theme":"Embed: tema och storlek","question":"Vad ska den smala embedden visa i huvudet?","why":"I 400×320 tar huvudet ca 80 px, så kullen får knappt 240 px.","findings":["embed-smal-huvud-tar-plats"],"options":[{"key":"a","label":"Namn och nedräkning på en rad, hårlinje","detail":"\"Ny inloggning · 4 dagar kvar\" och en 2 px stapel under. Huvudet ca 32 px, kullen ca 288 px.","mockup":"mockups/Q20/a.html","recommended":true},{"key":"b","label":"Bara nedräkning","detail":"\"4 dagar kvar av 8 veckor\" och ingen stapel; Projektets namn står redan i Notion-sidan. Huvudet ca 24 px.","mockup":"mockups/Q20/b.html"}]}],"findings":[{"id":"embed-stjarna-lista-koppling","view":"embed","viewport":"embed-bred","selector":".kropp","appliesTo":["embed","embed-dag"],"title":"I bred läge går det inte att se vilken stjärna som är vilken Scope","severity":"P1","source":"critique","category":"hierarchy","theme":"Embed: läsa kullen","why":"Utan markering visas inga etiketter, så kopplingen mellan stjärna och listrad går bara via färg. Grannar på kullen har nästan samma färg (Felmeddelanden 10 och Sessionshantering 30 är båda orange, Tillgänglighetsgranskning 71 och BankID-flöde 85 båda blå), och kullen saknar skala, så Läge-siffrorna i listan hjälper inte heller. Listan är dessutom sorterad 85→10, motsatt kullens vänster-till-höger. I mötet frågar någon \"vilken är min?\" och måste klicka rad för rad. Hover på en rad gör ingenting med stjärnan.","fix":"Länka listan och kullen åt båda håll vid hover och fokus (rad → ring och etikett på stjärnan, stjärna → markerad rad). Visa dessutom alla etiketter som får plats utan krock när höjden räcker (se frågan om etiketter), och sortera listan 0→100 så den läses i samma riktning som kullen, eller vänd kullen-ordningen tydligt.","rule":{"ref":"Spec #31 story 18; Product Principle 1","says":"En Scopes färg ska göra läget läsbart utan etiketter; Hill chart är produkten.","does":"Färgen visar ungefärligt läge men räcker inte för att skilja Scopes åt; utan etiketter blir kullen ett mönster utan namn."},"suggested":"fix","suggestedWhy":"Hover-kopplingen är liten och självklar; hur många etiketter som ska visas är ett designval i frågan nedan.","question":"Q3","pin":{"x":0,"y":17.4,"w":100,"h":82.6}},{"id":"fo-ta-bort-erbjuds-trots-sparr","view":"fo-plattform","viewport":"desktop","title":"\"Ta bort\" erbjuds och bekräftas trots att Plattform har Pågående Projekt","severity":"P1","source":"critique","category":"friction","theme":"Handlingar i sidhuvudet","why":"Plattform har två Pågående Projekt, så kärnan vägrar Ta bort. Ändå visar knappen en bekräftelse som lovar \"Ta bort Plattform med 3 Projekt? Det kan återställas.\" med en röd \"Ta bort\"-knapp; först efter klicket kommer felet. Användaren får ett löfte som sedan bryts, i ett ögonblick som redan känns riskabelt.","fix":"Visa \"Ta bort\" bara när alla Projekt är Avslutade. Annars: en inaktiv knapp med förklaringen bredvid, t.ex. \"Kan tas bort när alla Projekt är Avslutade (2 pågår)\". Datat för att avgöra det finns redan på sidan.","selector":".titlerow > :last-child","rule":{"ref":"spec #31 berättelse 66","says":"Ta bort på ett Funktionsområde bara när alla dess Projekt är Avslutade.","does":"Knappen och bekräftelsen visas alltid; spärren märks först som ett fel efter bekräftelsen."},"suggested":"fix","suggestedWhy":"Regeln är bestämd i specen och kan avgöras i klienten; ändringen är liten.","pin":{"x":33.4,"y":14.7,"w":4.3,"h":3}},{"id":"projekt-telefon-diagram-for-litet","view":"projekt","viewport":"phone","title":"På telefon blir diagrammets etiketter ca 6 px och stjärnorna för små att träffa med tummen","severity":"P1","source":"critique","category":"mobile","theme":"Hill chart på telefon","why":"Diagrammet ritas i en fast viewBox på 900 enheter och skalas ner till kolumnbredden. På telefon blir 15-enheters etiketter omkring 6–7 px höga och träffytan (radie 16 enheter) ungefär 13 px i diameter, långt under 44 px. Dessutom renderas sidan 457 px bred på en 390 px-telefon eftersom sidhuvudet sticker ut (sidhuvudet granskas separat), vilket krymper allt ytterligare. En Scopes Ägare som justerar sitt Läge från telefonen mellan möten är en av tre målgrupper, och PRODUCT.md lovar att redigering är lika direkt som att peka.","fix":"Ge diagrammet under 900 px en egen ruta i riktiga pixlar, som kompaktRuta redan gör för embed: mät bredden, behåll gradnät och axel men rita etiketter i 13–14 px och en osynlig träffcirkel på minst 22 px radie i CSS-pixlar. Visa bara vald stjärnas etikett (etiketter=\"valt\", som i embed) när fler än ca 4 Scopes trängs, eftersom listan direkt under redan har namnen.","selector":".chart svg","pin":{"x":3.5,"y":28.6,"w":78,"h":18.6},"rule":{"ref":"PRODUCT.md, Product Principles 3","says":"Editing is as direct as pointing: drag the dot, on desktop, phone or inside Notion.","does":"På telefon är stjärnan ca 13 px att träffa och etiketterna går inte att läsa."},"appliesTo":["projekt","projekt-scope-vald","projekt-signatur-remsa","stjarnkarta"],"suggested":"fix","suggestedWhy":"Huvuduppgiften för en av tre målgrupper; mönstret finns redan i embed.","alsoFlaggedBy":["Impeccable audit"],"question":"Q17"},{"id":"stjarnkarta-telefon-for-liten","view":"stjarnkarta","viewport":"phone","selector":".sky svg","title":"Stjärnkartan krymper till oläslig storlek på telefon","severity":"P1","source":"critique","category":"mobile","theme":"Hill chart på telefon","why":"Kartan ritas i en 900 punkter bred viewBox som skalas ner till ungefär 340 px: etiketterna blir omkring 6 px, \"Ingen rörelse på 21 dagar\" likaså, och stjärnornas träffyta (radie 16 i viewBox) blir runt 12 px. Mina Scopes är just den sida en Ägare öppnar på telefonen mellan möten (PRODUCT.md), så det viktigaste jobbet – att läsa och dra sin egen stjärna – blir gissning och feltryck.","fix":"Under ca 600 px: rita kullen i verkliga pixlar som inbäddningens kompakta läge (kompaktRuta, 13 px text) med högre bild än bredd, visa etikett bara för vald stjärna (etiketter=\"valt\") och låt nyckeln under kartan vara etikettlistan. Gör stjärnornas osynliga träffyta minst 44 px i skärmpixlar.","rule":{"ref":"PRODUCT.md › Product Principles 3","says":"Editing is as direct as pointing: drag the dot, on desktop, phone or inside Notion.","does":"På telefon är stjärnan ca 12 px att träffa och etiketterna ca 6 px höga."},"suggested":"fix","suggestedWhy":"Känd lösning finns redan i HillChart (kompakt-läget), och telefonen är huvudvägen för Ägaren som uppdaterar själv.","question":"Q17","pin":{"x":5.5,"y":33.5,"w":74.4,"h":28.6}},{"id":"projekt-historik-visa-utom-synhall","view":"projekt-historik-visa","viewport":"desktop","title":"Visa längre ner i Historik ändrar ett diagram som ligger utanför skärmen","severity":"P1","source":"critique","category":"states","theme":"Historik och återställning","why":"Historik-panelen är 24 rader och sidan blir 2750 px hög. Klickar man Visa på en rad längre ner byts diagrammet och bannern dyker upp högst upp, utom synhåll; på telefon hamnar bannern ovanför skärmen (uppmätt: -67 px). Det enda som syns är att raden blir markerad, så man tror inte att något hände eller jämför fel bild innan man trycker Återställ hit.","fix":"På skrivbord: gör sidopanelen sticky under sidhuvudet med egen scroll (max-height: calc(100vh - 56px); overflow: auto), så diagrammet och bannern alltid syns bredvid raden. På telefon: scrolla bannern i vy när Visa trycks, och ha \"Tillbaka till nu\" i bannern som redan finns.","selector":".visning","pin":{"x":17.1,"y":13.6,"w":52.6,"h":4.8},"appliesTo":["projekt-historik","projekt-historik-visa"],"suggested":"fix","suggestedWhy":"Liten CSS-ändring som gör förhandsvisningen, säkerhetsnätet mot misstag, användbar."},{"id":"projekt-dag-mittfarger-grumliga","view":"projekt-dag","viewport":"desktop","title":"I dag blir Läge 50–65 olivgrått och lerigt","severity":"P1","source":"critique","category":"consistency","theme":"Läge-färgskalan","why":"Dag-rampen interpolerar i RGB från #c9a21a (50) till #5a86d6 (75). Läge 55 blir #b39c40 (oliv) och 65 ungefär #86918b (grå). Lösenordsåterställning 55 ser senapsgrön ut, och mitten av färgskalan i listan är grågrön. Krönet är det intressantaste stället på banan, och där är färgen svagast; #c9a21a mot vitt ligger dessutom under 3:1 för grafik.","fix":"Interpolera i OKLCH i stället för RGB, mörka krönet till en renare bärnsten (ca #b8860b) och lägg till ett stopp vid ca 62 i en kall, ren ton (t.ex. #6f86c8) så att övergången går via skiffer i stället för grå. Kontrollera 3:1 mot #ffffff för varje heltal 0–100.","selector":"aside .legend .bar","pin":{"x":75.7,"y":45.2,"w":20,"h":1.4},"rule":{"ref":"Spec #31, Implementation Decisions (visual)","says":"Known open points: label collisions and the murky dag mid colours around Läge 50–65.","does":"Fortfarande lerigt: 55 = #b39c40, 65 ≈ #86918b."},"suggested":"fix","suggestedWhy":"Känd öppen punkt i specen; ren färgjustering i hill.ts.","alsoFlaggedBy":["Impeccable audit","område: Embed"],"appliesTo":["embed","embed-dag"]},{"id":"projekt-sidopanel-bredare-an-fonstret","view":"projekt","viewport":"desktop","title":"Scope-listan är bredare än sin kolumn, så sidan scrollar i sidled på 1440 px","severity":"P1","source":"critique","category":"layout","theme":"Projektsidans layout","why":"Uppmätt på 1440 px: tabellen i sidopanelen är 360 px i en kolumn på 340 px, så dokumentet blir 1483 px brett. Läge-kolumnen och rubriken \"Läge\" skärs av vid fönsterkanten, och sidhuvudet slutar före sidans högerkant. Läge är just det tal listan finns för, och en vågrät scroll på en vanlig laptop känns trasig på ett delat möte.","fix":"Låt tabellen få plats i 340 px: sätt table-layout: fixed med kolumnbredder (namn flexibel med radbrytning, Ägare ca 110 px, Läge ca 44 px), lägg ✦ på samma rad som namnet eller flytta den (se projekt-agare-cell-tva-rader), och ge sidopanelens kolumn minmax(320px, 360px) i grid-mallen. Kontrollera med det längsta Scope-namnet i testdatan (\"Tillgänglighetsgranskning\").","selector":"aside section.index table","pin":{"x":75.7,"y":8,"w":24.3,"h":33},"appliesTo":["projekt","projekt-dag","projekt-scope-vald","projekt-ny-scope","projekt-badda-in"],"suggested":"fix","suggestedWhy":"Känt fel med känd lösning i en CSS-regel; syns på huvudvyn i den vanligaste bredden.","alsoFlaggedBy":["Impeccable audit"],"mockup":{"after":"mockups/projekt-sidopanel-bredare-an-fonstret/after.html"}},{"id":"header-telefon-for-brett","view":"fo-plattform","viewport":"phone","title":"Sidhuvudet med Signatur är för brett på telefon och hela sidan skrollar i sidled","severity":"P1","source":"critique","category":"mobile","theme":"Sidhuvud","why":"Med en Signatur ihågkommen blir dokumentet 457 px brett i en 390 px skärm (uppmätt: scrollWidth 457). \"Mina Scopes\" bryts på två rader, kugghjulet hamnar utanför skärmen och hela sidan glider i sidled när man drar med tummen. Det är just Ägaren som har en Signatur och uppdaterar från telefonen mellan möten, så det drabbar huvudpersonen för mobil användning på varje sida.","fix":"Under ca 600 px: låt sidhuvudet bara visa märket, Signaturen som en kompakt knapp med initialer (t.ex. \"AL\") och kugghjulet; flytta \"Mina Scopes\" och temaväxlaren in i en meny bakom Signaturknappen, eller visa \"Mina Scopes\" som en ikon. Sätt white-space: nowrap på länkarna och min-width: 0 på .right så att inget kan tvinga fram sidledsskroll.","selector":"header .right","appliesTo":["start-signatur","fo-plattform","fo-ekonomi","saknas","projekt","projekt-dag","projekt-historik","projekt-scope-vald","projekt-badda-in","projekt-over-tid","projekt-avslutat","projekt-borttagen","projekt-saknas","stjarnkarta","personer"],"suggested":"fix","suggestedWhy":"Känd lösning, liten ändring i App.svelte, och den drabbar huvudflödet på telefon.","alsoFlaggedBy":["Impeccable audit"],"pin":{"x":34.1,"y":0,"w":65.9,"h":7},"question":"Q16"},{"id":"projekt-vem-remsan-sager-for-lite","view":"projekt-signatur-remsa","viewport":"phone","title":"\"Vem?\"-remsan säger inte att ändringen väntar, och går inte att avbryta","severity":"P1","source":"critique","category":"copy","theme":"Signatur-remsan","why":"Efter första draget visar telefonen bara \"Vem?\", \"Välj Person\" och en avstängd \"Spara\". Förklaringen \"Kommer ihåg valet på den här enheten.\" är dold under 900 px. Stjärnan står redan på 11 som om den vore sparad. Det finns inget Avbryt; lämnar man sidan kastas draget utan besked. En förstagångsanvändare vet inte varför hen tillfrågas, att ändringen inte är sparad eller hur man ångrar sig.","fix":"Skriv vad som väntar och varför: \"Vem flyttade Felmeddelanden? Ändringen sparas när du valt namn.\" (bygg texten från den hållna ändringen). Visa \"Kommer ihåg valet på den här enheten.\" även på telefon, på egen rad. Lägg till \"Avbryt\" som kastar draget och låter stjärnan glida tillbaka. Markera den hållna stjärnan, t.ex. med streckad ring, tills den är sparad.","selector":"form.strip","pin":{"x":0,"y":92,"w":100,"h":8},"suggested":"fix","suggestedWhy":"Första mötet med redigering för varje ny enhet; copy och en knapp, ingen ny modell.","alsoFlaggedBy":["Impeccable audit","område: Embed"],"appliesTo":["embed"]},{"id":"embed-stilla-forklaras-inte","view":"embed","viewport":"embed-bred","selector":".himmel g.scope:has(circle.stilla)","appliesTo":["embed","embed-dag"],"title":"Stilla Scope syns bara som en liten streckad ring utan förklaring","severity":"P1","source":"critique","category":"states","theme":"Status och stilla","why":"Sessionshantering har stått still i 26 dagar, men i embedden syns det bara som en 10 px streckad ring kring en 4 px prick. Texten \"Ingen rörelse på 26 dagar\" finns bara i hover-tooltippen (\u003ctitle>), och listan visar ingenting. På en delad skärm hovrar ingen, så den Scope produkten mest vill få pratad om är den som syns minst. Projekt-sidans lista visar \"26 d\" i rött under Läget; embedden tappar det.","fix":"Visa stillheten i text där folk tittar: i bred läge en röd \"26 d\" (eller \"stilla 26 d\") i listraden, samma mönster som Projekt-sidans lista, och sortera inte bort den. I smal läge lägg \"· 26 d\" efter stjärnans etikett i --redtx. Gör ringen tydligare (r 12–13, stroke 1.4) så den syns även på avstånd.","rule":{"ref":"Spec #31 story 20; PRODUCT.md Product Purpose","says":"En Scope utan rörelse i mer än 14 dagar ska visa streckad röd ring och \"Ingen rörelse på N dagar\", så att fastnat arbete blir pratat om.","does":"Embedden visar ringen men texten bara i en hover-tooltip; listan saknar markering."},"suggested":"fix","suggestedWhy":"Känt mönster från Projekt-sidan, liten ändring, och det är embeddens viktigaste budskap i mötet.","pin":{"x":19.2,"y":43.5,"w":4.4,"h":10}},{"id":"dag-borders-orbit-weak","view":"projekt-dag","viewport":"desktop","appliesTo":["projekt-dag","embed","embed-dag"],"title":"I dag-temat är fältkanter och själva banan under 3:1","severity":"P2","source":"audit","category":"a11y","theme":"Accentfärg och kontrast","why":"--btn #b9c4dc, som ritar kanten på \"Historik\", Signatur-väljaren och alla inmatningsfält, har 1,56:1 mot dag-grunden (natt 2,30:1). --orbit #8a9ac0, banan stjärnorna åker på, har 2,5–2,8:1 mot vitt. Fält syns knappt som fält och kurvan, som är hela produktens grafik, blir blek på en projektor.","fix":"Mörka dag-tokens: --btn till ca #8d9ab8 (≥3:1) och --orbit till ca #6f80aa (≥3:1 mot #fff). Höj natt --btn något (≥3:1 mot --bg).","selector":"svg path[stroke='var(--orbit)']","suggested":"fix","suggestedWhy":"Två token-värden i app.css (och i Embed.svelte, se separat fynd).","pin":{"x":2,"y":13,"w":10,"h":2.9}},{"id":"primarknapp-kontrast","view":"start","viewport":"desktop","title":"Vit text på den röda primärknappen når inte 4,5:1","severity":"P2","source":"critique","category":"a11y","theme":"Accentfärg och kontrast","why":"Vit 14 px text på --red #e0503a ger cirka 3,9:1 i natt. En orangeare röd, som ägaren vill ha, sänker kontrasten ytterligare om texten förblir vit (t.ex. #f0582a ger ca 3,4:1).","fix":"Byt accenten mot en orangeröd och låt texten på den vara mörk i natt: t.ex. --red #f0602e med text #081026 (ca 5,5:1), --redtx #ff8a5c för text på mörk bakgrund. I dag: --red #c44a1c med vit text (ca 4,8:1), --redtx #b0401a. Kontrollera Läge-rampens orange i hill.ts så att accenten och Läge 0–20 inte flyter ihop.","selector":"main .pagehead button.pr","appliesTo":["start","start-signatur","fo-plattform","fo-ekonomi","projekt","projekt-over-tid","projekt-avslutat","personer","projekt-historik-visa","projekt-ny-scope","projekt-signatur-remsa"],"rule":{"ref":"R/src/web/app.css (Stjärnatlas-token)","says":"button.pr: den under), men diagrammet, de dragbara stjärnorna och den röda \"Ny Scope\" är oförändrade. En ledare som skannar ser inte på diagrammet att arbetet är stängt, och slutet på ett Projekt, ett av få naturliga höjdpunktsögonblick, passerar utan någon känsla av avslut.","fix":"Visa Avslutat en gång, i statusraden. Dämpa stjärnorna som Stjärnkartan redan gör med dimmade Avslutade Projekt (opacity 0,45) och gör \"Öppna igen\" till sidans primära knapp i stället för \"Ny Scope\". Lägg ett lugnt avslut i statusraden, t.ex. \"Avslutat 12 nov. av Bo Ek\" hämtat från Historik.","selector":".huvud .status","pin":{"x":18.3,"y":21.8,"w":13,"h":2.6},"suggested":"fix","suggestedWhy":"Använder befintliga delar (dimmade, Historik); valet av hur stängt det ska kännas är ägarens.","question":"Q8"},{"id":"badda-in-panel-overflow-phone","view":"projekt-badda-in","viewport":null,"title":"\"Bädda in i Notion\"-panelen hamnar utanför telefonskärmen","severity":"P2","source":"audit","category":"mobile","theme":"Bädda in","why":"Panelen är position: absolute med left: 0 från knappen \"Bädda in\" och 90vw bred. På 390 px börjar knappen ca 220 px in, så panelen sträcker sig till 572 px och halva innehållet, inklusive \"Kopiera\" och \"Stäng\", ligger utanför skärmen. Panelen stängs inte heller med Escape eller klick utanför.","fix":"Placera panelen mot sidans kant på smala skärmar (position: fixed; inset-inline: 16px) eller som ett bottenark, och stäng på Escape och klick utanför med fokus tillbaka till \"Bädda in\".","selector":"span.badda > div.panel","suggested":"fix","suggestedWhy":"Liten ändring; panelen är oanvändbar på telefon i dag.","appliesTo":["projekt-badda-in"],"pins":{"desktop":{"x":31.6,"y":19.9,"w":29.7,"h":23.5}}},{"id":"embed-lista-namn-kapas","view":"embed","viewport":"embed-bred","selector":".lista","appliesTo":["embed","embed-dag"],"title":"Scope-namnen kapas till oläslighet i listan","severity":"P2","source":"critique","category":"layout","theme":"Embed: läsa kullen","why":"I 230 px listan tar Ägare och Läge så mycket plats att namnen blir \"Tillgänglighets…\", \"Lösenordsåterstäl…\", \"Sessionsha…\" och \"Felmeddeland…\". Listan är embeddens legend; när namnet kapas är den enda vägen till vilken Scope det är en tooltip.","fix":"Ge namnet företräde: Ägare på en andra rad i --dim 12 px (raden blir ca 34 px, fem rader ryms fortfarande i 265 px), eller visa bara förnamn. Låt listan växa till ca 260 px när rutan är bredare än 640 px.","suggested":"fix","suggestedWhy":"Ren layoutändring inom listan, inget beslut behövs.","pin":{"x":68.1,"y":17.4,"w":31.9,"h":82.6},"mockup":{"after":"mockups/embed-lista-namn-kapas/after.html"}},{"id":"embed-uppfor-nedfor-saknas","view":"embed","viewport":"embed-bred","selector":".himmel svg","appliesTo":["embed","embed-dag"],"title":"Kullen säger inte vad uppför och nedför betyder","severity":"P2","source":"critique","category":"copy","theme":"Embed: läsa kullen","why":"Embedden når fler än teamet: alla som läser Notion-sidan. Utan \"Uppför · lista ut\" och \"Nedför · genomföra\" ser kullen ut som en normalfördelning med prickar, och en läsare tolkar höger som \"klart\" eller toppen som \"bäst\". Prototypen visade texterna när rutan var högre än 150 px; implementationen tog bort dem helt för kompakt.","fix":"Lägg tillbaka prototypens två axeltexter i 11–12 px --dim under baslinjen (\"Uppför · lista ut\" vänster, \"Nedför · genomföra\" höger) när rutans höjd tillåter, som i prototypen (h > 150).","rule":{"ref":"origin/prototype/embed variant B; Product Principle 2","says":"Prototypen ritar \"Uppför · lista ut\" och \"Nedför · genomföra\" när kullens ruta är över 150 px; position betyder osäkerhet, inte framsteg.","does":"kompakt-läget i HillChart.svelte ritar ingen axeltext alls."},"suggested":"fix","suggestedWhy":"Redan beslutat i prototypen, liten ändring i HillChart.","pin":{"x":0,"y":17.4,"w":68.1,"h":82.6},"question":"Q14"},{"id":"embed-alltid-dag","view":"embed-all","viewport":null,"appliesTo":["embed","embed-dag"],"title":"Embedden är alltid ljus och ignorerar både ?tema och sparat tema","severity":"P2","source":"critique","category":"consistency","theme":"Embed: tema och storlek","why":"Embed.svelte anropar tema.visa(\"dag\") och .ap hårdkodar en egen kopia av dag-tokens, så ?tema=dag är verkningslös och \"apogee.tema\" = \"natt\" ger också ljust (testat). Det är avsiktligt enligt spec story 88, och vitt smälter in i Notions ljusa sida. Men i Notion i mörkt läge blir embedden en vit ruta på #191919, och den låsta Stjärnatlas-riktningen (natthimmel) syns aldrig där flest ser Apogee. Den kopierade tokenuppsättningen i .ap kan också glida isär från app.css.","fix":"Välj beteende i frågan om embed-tema. Oavsett val: läs tokens från app.css [data-theme=\"dag\"] och låt .ap bara åsidosätta --bg (#fff), i stället för en egen kopia.","rule":{"ref":"Spec #31 story 30 och 88","says":"dag-temat finns för ljusa ytor som Notion; embedden visar kullen i dag.","does":"Följer regeln, men Notions mörka läge täcks inte och tokens är duplicerade."},"suggested":"fix","suggestedWhy":"Rätt väg avgörs av fråga Q2; själva problemet ska lösas.","question":"Q2"},{"id":"embed-hog-ruta-stracks","view":"embed-all","viewport":null,"appliesTo":["embed","embed-dag"],"title":"Högre embed sträcker bara kullen till en spira","severity":"P2","source":"critique","category":"mobile","theme":"Embed: tema och storlek","why":"Den som drar Notion-blocket högre för att se bättre får ingen ny information: vid 720×600 och 400×600 blir kullen en smal spira (kompaktRuta fyller hela höjden), listan får 300 px tomrum och etiketterna i bred läge visas fortfarande inte. Vid 720×200 blir kullen däremot platt men läsbar. Höjden används som skalning, inte som utrymme.","fix":"Begränsa kullens höjd till ungefär 0,45 × bredden och centrera den vertikalt; använd överskottet till axeltexterna och till att visa alla etiketter som får plats (t.ex. från ca 420 px höjd även i bred läge).","suggested":"fix","suggestedWhy":"Begränsad ändring i kompaktRuta och etikettvalet.","question":"Q3"},{"id":"fo-sidhuvud-for-manga-handlingar","view":"fo-plattform","viewport":"phone","title":"Sex handlingar före Projekten, och på telefon bryts de konstigt","severity":"P2","source":"critique","category":"hierarchy","theme":"Handlingar i sidhuvudet","why":"\"Byt namn\", \"Kopiera länk\", \"Ta bort\", \"Ändra datum\", \"Ny Milstolpe\" och \"Nytt Projekt\" står alla framme, fler än fyra val på samma ställe. De sällsynta handlingarna (byta namn, ta bort) står närmast rubriken och har samma vikt som de vanliga. På telefon hamnar \"Ta bort\" ensam och indragen på en egen rad under rubriken, och första Projektet börjar först ca 380 px ned.","fix":"Behåll \"Nytt Projekt\" och tidsplanens \"Ändra datum\"/\"Ny Milstolpe\" synliga. Samla \"Byt namn\", \"Kopiera länk\" och \"Ta bort\" bakom en knapp \"Mer\" (eller ⋯) bredvid rubriken. På telefon: rubrik, status och nedräkning först, Projekten sedan.","selector":"main .pagehead","appliesTo":["fo-plattform","fo-ekonomi"],"suggested":"fix","suggestedWhy":"Hierarkin är tydligt fel; var de sällsynta handlingarna ska bo är en fråga till ägaren.","question":"Q18","pin":{"x":3.5,"y":9.8,"w":78.3,"h":22.7}},{"id":"projekt-fjorton-kontroller-fore-diagrammet","view":"projekt","viewport":"desktop","title":"Fjorton kontroller i samma vikt står före diagrammet","severity":"P2","source":"critique","category":"hierarchy","theme":"Handlingar i sidhuvudet","why":"Ovanför diagrammet ligger Byt namn, Flytta, Kopiera länk, Bädda in, Ta bort, Historik, Ny Scope, Pågående/Markera Avslutat, nedräkningen, datumraden med Ändra datum och Ny Milstolpe, och Milstolpe-raden med Ändra och Ta bort: fyra rader och fjorton beslutspunkter. Underhållsåtgärder som används en gång per kvartal har samma vikt som nedräkningen. Diagrammet börjar vid 375 px på skrivbord och ca 420 px på telefon. Status (\"Pågående\") och nedräkningen står på olika rader fast de svarar på samma fråga.","fix":"Samla sällan använda åtgärder (Byt namn, Flytta, Kopiera länk, Bädda in, Markera Avslutat, Ta bort) i en meny \"Mer ▾\" bredvid Historik och Ny Scope. Slå ihop status och tid till en rad: \"Pågående · 4 dagar kvar av 8 veckor · ◆ Acceptanstest om 4 dagar\". Låt datum och Milstolpar redigeras från en \"Ändra datum och Milstolpar\" som fäller ut nuvarande formulär. Målet är att diagrammet börjar under titeln plus en rad.","selector":".huvud .titlerow","pin":{"x":17.8,"y":13,"w":54.5,"h":22},"rule":{"ref":"PRODUCT.md, Product Principles 1","says":"The Hill chart is the product; everything else is navigation to it.","does":"Fyra rader verktyg och metadata trycker ner diagrammet till mitten av skärmen."},"appliesTo":["projekt","projekt-dag","projekt-over-tid","projekt-avslutat"],"suggested":"fix","suggestedWhy":"Huvudvyn; omgruppering av befintliga kontroller utan ny funktion.","question":"Q5"},{"id":"projekt-etiketter-trangs","view":"projekt-historik-visa","viewport":"desktop","title":"Etiketter trängs vid krönet och vid 95–100, och stilla-texten räknas inte som hinder","severity":"P2","source":"critique","category":"layout","theme":"Hill chart: etiketter","why":"I Visa står Tillgänglighetsgranskning 45 och Lösenordsåterställning 55 vid krönet; den andra etiketten trycks ner på banan och nuddar den streckade ringen. I Betalningar v2 ligger \"Kortbetalning 95\" och \"Kvitton 100\" tätt ovanpå banan vid baslinjen. placeraEtiketter tar hänsyn till andra etiketter och stjärnkärnor, men inte till texten \"Ingen rörelse på N dagar\" med dess ledarlinje, så en etikett kan hamna ovanpå den.","fix":"Lägg stilla-textens ruta och ledarlinje som hinder i placeraEtiketter, och lägg banans linje närmast stjärnan som hinder för etiketter under stjärnan. Vid krönet: föredra att stapla uppåt med ledarlinje framför att lägga etiketten under. Lägg till en trängd testprojekt-fixture (två Scopes på 45/55, två på 95/100, en stilla nära) och titta på den i båda teman.","selector":"svg g.scope text.sn","pin":{"x":37.5,"y":22.5,"w":17,"h":3},"rule":{"ref":"Spec #31, user story 29 och Known open points","says":"Labels of stars that sit close together should not collide.","does":"Etiketter ligger på banan och mot ringar vid krönet och vid 95–100."},"appliesTo":["projekt-historik-visa","projekt-over-tid"],"suggested":"fix","suggestedWhy":"Känd öppen punkt; algoritmen finns, den behöver fler hinder.","mockup":{"after":"mockups/projekt-etiketter-trangs/after.html"}},{"id":"stjarnkarta-etikett-klipps","view":"stjarnkarta","viewport":null,"title":"Etiketter längst till vänster klipps av kartans kant","severity":"P2","source":"critique","category":"layout","theme":"Hill chart: etiketter","why":"På Elin Sjös Stjärnkarta står två Scopes nära Läge 0; etiketten för \"B Export till PDF 0\" hamnar utanför vänsterkanten och syns bara som \"till PDF 0\", både på desktop och telefon. Story 74 lovar att trånga etiketter staplas med ledarlinjer så att kartan förblir läsbar.","fix":"Låt placeraEtiketter hålla etiketten inom viewBox: vid Läge nära 0 förankra texten till höger om stjärnan (text-anchor start) eller stapla den uppåt med ledarlinje, och spegla samma regel vid Läge 100.","suggested":"fix","suggestedWhy":"Tydlig bugg i etikettplaceringen, liten ändring.","mockup":{"after":"mockups/stjarnkarta-etikett-klipps/after.html"}},{"id":"projekt-historik-knapp-utan-tryckt-lage","view":"projekt-historik","viewport":"desktop","title":"Historik-knappen ser likadan ut öppen som stängd, och panelen ersätter Scope-listan","severity":"P2","source":"critique","category":"states","theme":"Historik och återställning","why":"Knappen har aria-pressed=\"true\" när panelen är öppen men samma ram, bakgrund och text som stängd. Samtidigt försvinner Scope-listan med Ägare och Läge, så man ser inte varför vyn bytt eller hur man kommer tillbaka förutom \"Stäng\" uppe till höger i panelen.","fix":"Ge [aria-pressed=\"true\"] ett synligt tryckt läge i accentfärgen (accentram och svag accentbakgrund), ett ställe där ägaren kan använda den orangeröda oftare. Behåll rubriken \"Historik\" i panelen och lägg \"← Scopes\" som stänglänk i stället för \"Stäng\".","selector":"button[aria-pressed]","pin":{"x":62.2,"y":5.5,"w":5.5,"h":1.3},"suggested":"fix","suggestedWhy":"En CSS-regel och en etikett.","question":"Q1"},{"id":"projekt-historik-knappvagg","view":"projekt-historik","viewport":"desktop","title":"Historik är en vägg av ca 70 likadana knappar, och Återställ hit sker med ett klick","severity":"P2","source":"critique","category":"friction","theme":"Historik och återställning","why":"Varje rad har \"Visa\", \"Återställ hit\" och \"Ångra bara denna\" i samma tysta stil; med 24 rader blir det ca 70 knappar som drar blicken från vem, vad och när. \"Återställ hit\" på en rad skriver om hela diagrammet direkt, utan förhandsvisning, bekräftelse eller Ångra-toast, mitt i ett möte där andra drar stjärnor live. Att ta bort en Scope får \"Scope borttagen · Ångra\", men att återställa hela diagrammet får inget.","fix":"Visa radens åtgärder bara på hover, fokus eller vald rad (på telefon: tryck på raden). Låt \"Återställ hit\" ligga i Visa-bannern, så att man alltid ser innan man återställer, och visa efteråt en toast \"Diagrammet återställt · Ångra\" som för borttagen Scope.","selector":"section.historik ol","pin":{"x":77.9,"y":4.6,"w":20.8,"h":93},"suggested":"fix","suggestedWhy":"Valet mellan två lägen för Återställ hit är ägarens; resten är känt.","question":"Q7"},{"id":"projekt-visa-blandar-nu-och-da","view":"projekt-historik-visa","viewport":"desktop","title":"Under Visa står nutidens datum och Milstolpe kvar ovanför det gamla diagrammet","severity":"P2","source":"critique","category":"states","theme":"Historik och återställning","why":"Bannern säger \"Datumen skiljer sig från nu\" och visar \"Inga datum\", men raden ovanför visar fortfarande \"4 dagar kvar av 8 veckor\" och \"◆ Acceptanstest 30 nov. 2026\". Ny Scope, Ändra datum och Ny Milstolpe är också aktiva fast diagrammet är skrivskyddat. Två tidpunkter på samma skärm gör jämförelsen svårare, inte lättare. \"Inga datum\" har en streckad ram och ser ut som en knapp.","fix":"Under Visa: dämpa (opacity 0,4) eller dölj nuvarande nedräkning, datumrad och Milstolpar och stäng av Ny Scope, så att bannern är enda tidsangivelsen. Markera det som skiljer med en liten prick eller fet stil i stället för streckad ram.","selector":".huvud .tid","pin":{"x":17.1,"y":8.4,"w":52.6,"h":3.4},"suggested":"fix","suggestedWhy":"Tillståndet finns redan (visning), det används bara inte ovanför bannern."},{"id":"personer-lastrad-som-forlopp","view":"personer","viewport":"desktop","selector":"li .last .strip","title":"Lastraden läses som en förloppsstapel","severity":"P2","source":"critique","category":"hierarchy","theme":"Personer-sidan","why":"Varje Persons Scopes ritas som prickar på en rak linje 0–100 utan kulle, mittmarkering eller skala. Formen säger \"hur långt har de kommit\", inte \"uppför eller nedför\", och prickar på samma Läge ritas ovanpå varandra (Elin Sjö: 0 och 5). Ledaren som ska se last och fastnat arbete (story 78) får en förloppsbild i stället för en Hill chart.","fix":"Rita en liten kulle (samma form som startsidans mini-himlar) och lägg prickarna på kurvan, med en tunn markering vid toppen. Gör hela raden till länk till Stjärnkartan.","rule":{"ref":"PRODUCT.md › Product Principles 2","says":"Position means uncertainty, not progress: never turn Läge into a percentage bar.","does":"Läge ritas som prickar på en rak 0–100-linje utan kulle."},"suggested":"fix","suggestedWhy":"Mini-kullen finns redan på startsidan och kan återanvändas.","pin":{"x":23.7,"y":25.5,"w":17.5,"h":0.9},"mockup":{"after":"mockups/personer-lastrad-som-forlopp/after.html"}},{"id":"personer-namn-syns-inte-som-lank","view":"personer","viewport":"desktop","selector":"li .namn a","title":"Att namnet leder till Stjärnkartan syns inte","severity":"P2","source":"critique","category":"friction","theme":"Personer-sidan","why":"Namnen är länkar men har ingen understrykning och samma färg som vanlig text; bara en title-text avslöjar \"Stjärnkarta för …\". Personer är den enda vägen till en annan Persons Stjärnkarta utanför Projekt-sidan, så ledaren som ser \"1 stilla\" hittar inte vidare. Övriga länkar i appen (nyckelns Projekt) är understrukna.","fix":"Visa länken som länk (understrykning eller pil \"Stjärnkarta →\"), och låt lastraden vara en del av samma klickyta.","suggested":"fix","suggestedWhy":"CSS-ändring, stärker vyns huvudväg.","pin":{"x":8.9,"y":23.7,"w":4.6,"h":1.2}},{"id":"personer-knappar-for-sma-telefon","view":"personer","viewport":"phone","selector":"li .actions","appliesTo":["personer","stjarnkarta"],"title":"Knappar och rader är för små att träffa på telefon","severity":"P2","source":"critique","category":"mobile","theme":"Responsiv layout","why":"\"Byt namn\" och \"Ta bort\" är 27 px höga med 4 px mellanrum, \"Visa inaktiva (1)\" 27 px och namnlänkarna 18 px. I Stjärnkartans nyckel är Scope-namnen knappar utan utfyllnad, ca 18 px. På telefon blir det feltryck, och nyckeln är där tummen borde välja Scope när kartan är liten.","fix":"Ge knappar och nyckelns rader minst 44 px träffyta på smala skärmar (padding, inte större text), och mer avstånd mellan \"Byt namn\" och \"Ta bort\".","suggested":"fix","suggestedWhy":"CSS i en media query.","pin":{"x":51,"y":20.7,"w":30.8,"h":1.6},"question":"Q17"},{"id":"projekt-chart-squeezed-midwidth","view":"app-all","viewport":null,"title":"Hill charten krymper till 325 px mellan 901 och 1280 px","severity":"P2","source":"audit","category":"layout","theme":"Responsiv layout","why":"Över brytpunkten 900 px tar sidokolumnerna 236 + 340 px, så mittkolumnen blir ca 325 px vid 901 px och 450 px vid 1024 px. Etiketterna är då 5–7 px (13 px först vid 1280 px). En bärbar dator eller en delad skärm i ett halvt fönster får en mindre chart än telefonen.","fix":"Flytta brytpunkten för tre kolumner till ca 1200 px, och visa Funktionsområdets andra Projekt under charten (som på telefon) mellan 900 och 1200 px.","selector":"div.projekt","suggested":"fix","suggestedWhy":"Ändring av en brytpunkt; påverkar delad skärm i möten.","appliesTo":["projekt","projekt-dag","projekt-scope-vald","stjarnkarta"],"mockup":{"after":"mockups/projekt-chart-squeezed-midwidth/after.html"}},{"id":"projekt-agare-cell-tva-rader","view":"projekt","viewport":"desktop","title":"Ägare-cellen blir två rader med ett oförklarat ✦","severity":"P2","source":"critique","category":"copy","theme":"Scope-listan","why":"Ägaren är en genomskinlig select med pil, och länken till Stjärnkartan är ett ensamt \"✦\" som bryts ner på egen rad under namnet. Vad ✦ gör står bara i title, som inte syns på pekskärm. Varje rad blir dubbelt så hög, och ✦ bidrar till att listan inte får plats i sin kolumn.","fix":"Gör Ägarens namn till länken till Stjärnkartan och byt Ägare via en liten \"Byt\" i vald rads åtgärdsrad (bredvid Byt namn och Ta bort), eller behåll selecten och flytta \"✦ Stjärnkarta\" som text till åtgärdsraden. En rad per Scope.","selector":"aside td a.karta","pin":{"x":89.3,"y":14.6,"w":1.2,"h":1.6},"appliesTo":["projekt","projekt-scope-vald","projekt-over-tid"],"suggested":"fix","suggestedWhy":"Löser samtidigt en del av breddproblemet; valet av mönster är ägarens.","question":"Q10"},{"id":"projekt-ny-scope-utan-fokus","view":"projekt-ny-scope","viewport":"desktop","title":"Ny Scope-formuläret får inte fokus, stängs inte med Escape och saknar rubrik","severity":"P2","source":"critique","category":"friction","theme":"Scope-listan","why":"Uppmätt: efter klick på \"Ny Scope\" stannar fokus på knappen (autofocus i Namn tar inte), och Escape lämnar formuläret öppet. Fälten \"Namn\" och \"Ägare\" står utan rubrik högst upp i sidopanelen, så det ser ut som ett filter. På telefon öppnas formuläret ca 720 px under knappen och tangentbordet kommer inte upp. Den avstängda \"Lägg till\" blir en grumlig mörkröd, och \"Ny Scope\" lyser fortfarande rött medan formuläret är öppet.","fix":"Flytta fokus till Namn efter att formuläret renderats (tick() och sedan focus()), stäng med Escape, ge formuläret rubriken \"Ny Scope\", scrolla det i vy på telefon. Visa avstängd primärknapp som kontur i stället för halvgenomskinlig röd, och ge Ny Scope tryckt läge (aria-pressed) medan formuläret är öppet.","selector":"form.ny","pin":{"x":75.7,"y":8,"w":20,"h":18},"suggested":"fix","suggestedWhy":"Små beteenderättningar på ett vanligt flöde."},{"id":"header-kugghjul-ser-ut-som-sol","view":"start","viewport":"desktop","title":"Kugghjulet ser ut som en sol och står bredvid temaknappen \"Dag\"","severity":"P2","source":"critique","category":"consistency","theme":"Sidhuvud","why":"Ikonen för Inställningar är två ringar med strålar, alltså en sol, och den står direkt efter textknappen \"Dag\" som byter tema. Den som vill ha ljust tema klickar på solen och hamnar på Personer; den som letar efter Personer letar inte efter en sol. \"Dag\" visar dessutom läget man byter till, inte det man är i, så knappen läses som en etikett för ikonen bredvid.","fix":"Rita en riktig kugge (tänder, inte strålar) för Inställningar, eller skriv \"Inställningar\" i text på dator. Gör temaväxlaren till en ikonknapp med måne/sol som visar nuvarande tema, med aria-label som i dag. Låt kugghjulet stå sist och temaväxlaren före, med lite mer avstånd.","selector":"header a.gear","appliesTo":["start","start-signatur","fo-plattform","fo-ekonomi","saknas"],"suggested":"fix","suggestedWhy":"Ett byte av ikon och etikett; inga beteenden ändras.","pin":{"x":95.8,"y":1.2,"w":2.2,"h":3.3}},{"id":"embed-signatur-osynlig","view":"embed-dag","viewport":"embed-bred","selector":"header button.vem","appliesTo":["embed","embed-dag"],"title":"Det syns inte vems Signatur ett drag sparas med","severity":"P2","source":"critique","category":"states","theme":"Signatur-remsan","why":"Med en ihågkommen Signatur är huvudet identiskt med utan-läget: bara en omärkt personikon. I ett synkmöte där embedden visas från en dators Notion drar ofta flera via samma skärm, och varje drag sparas direkt med den datorns Signatur. Fel namn i Historiken upptäcks först i efterhand. Remsan säger heller inte att valet kommer ihåg, vilket webbplatsens remsa gör (\"Kommer ihåg valet på den här enheten.\").","fix":"Visa namnet bredvid ikonen i bred läge (\"Anna Lind\" i --dim 13 px, klickbart för att byta), bara ikonen i smal läge. Lägg till \"Kommer ihåg valet i den här inbäddningen.\" i remsan efter Spara-knappen i bred läge.","suggested":"fix","suggestedWhy":"Liten ändring som förebygger felattribuerade Uppdateringar.","pin":{"x":75.7,"y":4.5,"w":3.6,"h":8.1}},{"id":"start-ordning-doljer-problem","view":"oversikt-all","viewport":null,"title":"Ordningen hjälper inte en ledare att hitta det som står still","severity":"P2","source":"critique","category":"hierarchy","theme":"Status och stilla","why":"Funktionsområden och Projekt står i bokstavsordning. Med tre områden går det bra, men PRODUCT.md beskriver ledare som skannar \"många Projekt\"; med femton områden ligger det som är Över tid eller stilla var som helst på en lång sida.","fix":"Antingen sortera Projekt inom varje område efter behov av uppmärksamhet (Över tid, sedan flest stilla, sedan övriga, Avslutade sist) och behåll områdena i bokstavsordning, eller behåll bokstavsordningen och låt den samlade statusraden högst upp länka till de Projekt det gäller.","appliesTo":["start","start-signatur","fo-plattform"],"suggested":"fix","suggestedWhy":"Behovet är tydligt; vilken ordning som passar organisationen är ägarens val.","question":"Q4"},{"id":"start-saknar-samlad-status","view":"start","viewport":"desktop","title":"Sidans sammanfattning säger bara \"7 Projekt\", inte vad som behöver uppmärksamhet","severity":"P2","source":"critique","category":"hierarchy","theme":"Status och stilla","why":"Raden under \"Alla Funktionsområden\" är det första en ledare läser, men \"7 Projekt\" räknar även Avslutade och säger inget om läget. För att veta hur många Projekt som är stilla eller Över tid måste man skanna alla sektioner och räkna själv, vilket växer med antalet Funktionsområden.","fix":"Byt raden mot en samlad status med data som redan finns: \"5 pågående · 3 stilla · 1 över tid\", där \"stilla\" och \"över tid\" är i accentfärgen och bara visas när de är fler än noll. När allt rör sig: \"5 pågående · inget står still\".","selector":"main .pagehead .meta","appliesTo":["start","start-signatur"],"suggested":"fix","suggestedWhy":"Siffrorna finns redan i översiktsdatat; det är en textändring som ger ledarens fråga ett svar högst upp.","pin":{"x":8.9,"y":13.4,"w":24.8,"h":2},"mockup":{"after":"mockups/start-saknar-samlad-status/after.html"}},{"id":"stilla-forklaras-inte","view":"start","viewport":"desktop","title":"\"stilla\" förklaras ingenstans i översikten","severity":"P2","source":"critique","category":"copy","theme":"Status och stilla","why":"Den röda räkningen \"2 stilla\" är sidans viktigaste signal till en ledare, men ordet står inte i GLOSSARY.md och sidan säger inte att det betyder ingen rörelse på mer än 14 dagar. En nykomling kan läsa \"stilla\" som \"lugnt\" eller \"pausat\", alltså motsatsen till ett varningstecken. Projektsidan har texten \"Ingen rörelse på N dagar\", men översikten har den inte.","fix":"Ge varje stilla-räkning en title och en skärmläsartext: \"Ingen rörelse på över 14 dagar\". Lägg till \"Stilla\" i GLOSSARY.md (en Scope utan ändrat Läge på mer än 14 dagar), så att ordet blir en domänterm och används lika överallt.","selector":"main section:nth-of-type(2) h2 .stilla","appliesTo":["start","start-signatur","fo-plattform"],"rule":{"ref":"GLOSSARY.md","says":"Domäntermerna i gränssnittet står i GLOSSARY.md (PRODUCT.md: \"Domain terms are in GLOSSARY.md\").","does":"\"stilla\" används som statusord på varje cell och rubrik men finns inte i ordlistan och förklaras inte på sidan."},"suggested":"fix","suggestedWhy":"Liten textändring som gör huvudsignalen begriplig för alla.","pin":{"x":88.4,"y":42.3,"w":2.7,"h":1.7}},{"id":"embed-tokens-duplicated","view":"embed","viewport":"embed-bred","appliesTo":["embed","embed-dag"],"title":"Inbäddningen har en egen hårdkodad kopia av dag-tokens","severity":"P2","source":"audit","category":"consistency","theme":"Tokens och tema","why":"Embed.svelte definierar om 13 färger (--bg, --tx, --red, --orbit …) med hex-värden i .ap i stället för att använda [data-theme=\"dag\"] från app.css, som tema.visa('dag') redan sätter. När accenten görs orangeröd eller dag-rampen och kanterna justeras följer inbäddningen inte med, och Notion visar en annan röd än appen.","fix":"Ta bort blocket i .ap och låt inbäddningen ärva dag-tokens; behåll bara --bg: #ffffff som en avsiktlig avvikelse (Notions vita sida).","selector":"div.ap","suggested":"fix","suggestedWhy":"Förutsättning för att accentbytet ska slå igenom överallt.","pin":{"x":0,"y":0,"w":100,"h":100}},{"id":"avslutade-blandas-med-pagaende","view":"fo-plattform","viewport":"desktop","title":"Avslutade Projekt står mitt bland Pågående i bokstavsordning","severity":"P2","source":"critique","category":"hierarchy","theme":"Översiktens Projektceller","why":"\"Gammal API-gateway\" (Avslutat) står mellan \"Betalningar v2\" och \"Loggning och övervakning\". Den nedtonade cellen bryter raden som ögat skannar och tar en lika stor plats som de Projekt som behöver uppmärksamhet. När ett Funktionsområde samlat många Avslutade Projekt drunknar de pågående.","fix":"Sortera Pågående Projekt först och Avslutade sist inom varje Funktionsområde (samma ordning som Stjärnkartan redan använder). Överväg att visa Avslutade som en kompakt rad (\"Avslutade: Gammal API-gateway, Onboarding-guide\") under rutnätet i stället för fulla celler.","selector":"main a.cell.avslutat","appliesTo":["start","start-signatur","fo-plattform"],"suggested":"fix","suggestedWhy":"Att lägga Avslutade sist är känt och litet; hur mycket mer som ska sorteras är frågan.","question":"Q4","pin":{"x":36.3,"y": itique","category":"copy","theme":"Avslutat och borttaget","why":"\"Det här Projektet är borttaget. Testprojekt togs bort av Bo Ek. Öppna i Apogee ↗\" är tydligt, men den som ser en tom vit ruta i Notion vet inte att Borttagen går att ångra och kan tro att arbetet är förlorat. Raderad-läget (\"Det här Projektet finns inte längre.\") är rätt som det är.","fix":"Ändra länken till \"Återställ i Apogee ↗\" eller lägg till \"Det kan återställas i Apogee.\" som metarad, och visa Apogee-märket (✦) ovanför texten så att det syns varifrån meddelandet kommer.","suggested":"fix","suggestedWhy":"Copy-ändring."},{"id":"projekt-borttagen-atervandsgrand","view":"projekt-borttagen","viewport":"desktop","title":"Borttagen-sidan kräver ett extra steg för att återställa och tappar stjärnatlaset","severity":"P3","source":"critique","category":"delight","theme":"Avslutat och borttaget","why":"Den som följer en gammal länk vill troligen ha tillbaka Projektet, men måste gå till Borttagna-listan och leta upp det där. Sidan är också naken text på mörk botten, det enda stället i Projekt-flödet utan något av Stjärnatlas-världen, i ett ögonblick som redan känns som ett tapp.","fix":"Lägg \"Återställ\" som primär knapp direkt på sidan (samma kommando som i Borttagna-listan, med Signatur), och behåll länken till listan som sekundär. Visa ett tomt, dämpat gradnät med banan bakom texten som igenkänning.","selector":".page p a","pin":{"x":8.9,"y":19.6,"w":14.6,"h":2.4},"suggested":"later","suggestedWhy":"Sällan besökt sida; värt att göra men inte först."},{"id":"projekt-saknas-sager-langre","view":"projekt-saknas","viewport":"desktop","title":"En felskriven länk får \"Finns inte längre\", som om något raderats","severity":"P3","source":"critique","category":"copy","theme":"Avslutat och borttaget","why":"/p/finnsinte00-x har aldrig funnits men sidan säger \"Finns inte längre\" och \"Det här finns inte längre.\" Den som fått en trasig länk börjar leta efter vem som raderade Projektet. Specen avser texten för Raderade Projekt, och servern kan inte skilja dem åt.","fix":"Skriv en text som stämmer i båda fallen: rubrik \"Hittar inte Projektet\", text \"Länken kan vara felskriven, eller så har Projektet raderats.\" och kvar länken \"Till alla Funktionsområden\".","selector":".page h1","pin":{"x":8.9,"y":10.3,"w":17.8,"h":5},"rule":{"ref":"Spec #31, user story 84","says":"As anyone following a link to something Raderad, I want a 404 \"Finns inte längre\".","does":"Samma text visas för id som aldrig funnits."},"suggested":"fix","suggestedWhy":"Ren copy-ändring."},{"id":"projekt-badda-in-stangs-inte","view":"projekt-badda-in","viewport":"desktop","title":"Bädda in-dialogen stängs inte med Escape eller klick utanför, och tar inte fokus","severity":"P3","source":"critique","category":"a11y","theme":"Bädda in","why":"Uppmätt: dialogen (role=\"dialog\") ligger kvar efter Escape och efter klick i diagrammet, och fokus stannar i body. Den täcker nedräkningen och datumraden tills man hittar \"Stäng\" längst ner till höger.","fix":"Stäng med Escape och klick utanför, flytta fokus till inbäddningsfältet när den öppnas och tillbaka till \"Bädda in\" när den stängs. Samma beteende för andra popovers på sidan.","selector":".badda .panel","pin":{"x":31.7,"y":19.9,"w":29.6,"h":23.5},"suggested":"fix","suggestedWhy":"Standardbeteende, liten ändring."},{"id":"embed-vald-och-stilla-ringar","view":"embed-all","viewport":null,"appliesTo":["embed","embed-dag"],"title":"Vald och stilla ger två röda ringar på samma stjärna","severity":"P3","source":"critique","category":"consistency","theme":"Embed: läsa kullen","why":"När Sessionshantering markeras ritas den heldragna röda markeringsringen (r 13) utanpå den streckade röda stilla-ringen (r 10). Båda är röda och nästan lika stora, så de flyter ihop till en klump, och det går inte att se att den både är vald och stilla. Samma röda betyder två saker.","fix":"Låt rött (det nya orangeröda) betyda stilla och primär handling, och rita markeringen ill prototypens beslut.","pin":{"x":3.5,"y":8.8,"w":62.4,"h":13.8},"mockup":{"after":"mockups/embed-smal-huvud-tar-plats/after.html"},"question":"Q20"},{"id":"live-socket-errors","view":"projekt-saknas","viewport":"desktop","appliesTo":["projekt-saknas","projekt-avslutat"],"title":"Live-anslutning öppnas för Projekt som saknas eller är avslutade","severity":"P3","source":"audit","category":"states","theme":"Felsidor och tillstånd","why":"På /p/finnsinte00-x hämtas Projektet (404) och samtidigt öppnas WebSocket /api/projekt/finnsinte00/live två gånger, som båda misslyckas med 404 i konsolen. På ett avslutat Projekt stängs anslutningen innan den hunnit öppnas (varning). Sidan visar rätt \"Finns inte längre\", men felen gör konsolen brusig och servern får onödiga anslutningar.","fix":"Starta live-följningen först när första hämtningen lyckats och Projektet är pågående, och stäng den utan att öppna om sidan byter tillstånd.","suggested":"later","suggestedWhy":"Ingen synlig påverkan för användaren."},{"id":"saknas-ingen-karaktar","view":"saknas","viewport":"desktop","title":"404-sidan är korrekt men känns inte som Apogee","severity":"P3","source":"critique","category":"delight","theme":"Felsidor och tillstånd","why":"En återvändsgränd är ett slut på en uppgift, och där minns man tonen. \"Finns inte\" och \"Sidan finns inte.\" på en tom natthimmel är rakt men anonymt, och sidan erbjuder bara en väg tillbaka.","fix":"Lägg en tom miniatyrkarta (kullen utan stjärnor) ovanför rubriken och en rad i samma ton som appen, t.ex. \"Här finns inga stjärnor.\", följt av länken \"Till alla Funktionsområden\". Visa länken som knapp så att den är lätt att träffa på telefon.","selector":"main .page","suggested":"later","suggestedWhy":"Liten vinst, inget som hindrar någon; passar när felsidorna (Finns inte, Finns inte längre, borttaget) ses över tillsammans.","pin":{"x":6.9,"y":6.2,"w":86.1,"h":20.8}},{"id":"projekt-hjalptext-fel-plats","view":"projekt","viewport":"phone","title":"Hjälptexten om att dra står långt från diagrammet och nämner piltangenter på telefon","severity":"P3","source":"critique","category":"copy","theme":"Hill chart på telefon","why":"\"Dra en stjärna längs banan för att ändra dess Läge, eller markera den och använd piltangenterna.\" står under färgskalan, på telefon ca 700 px under diagrammet, och talar om piltangenter som telefonen inte har.","fix":"Flytta texten direkt under diagrammet och anpassa: på pekskärm \"Dra en stjärna längs banan för att ändra dess Läge.\", med tangentbord tillägget \"Markera och använd piltangenterna (Shift = 10 steg).\"","selector":"aside .index > p.meta","pin":{"x":3.5,"y":77.5,"w":78,"h":3.2},"suggested":"fix","suggestedWhy":"Copy och placering.","question":"Q19"},{"id":"projekt-inga-hojdpunkter-vid-kron-och-mal","view":"projekt","viewport":null,"title":"Inget markerar när en Scope passerar krönet eller når 100","severity":"P3","source":"critique","category":"delight","theme":"Hill chart: etiketter","why":"Krönet (Läge 50, \"krön\") är det viktigaste ögonblicket i en Hill chart: från att lista ut till att genomföra. När en stjärna dras över krönet eller ner till 100 händer ingenting extra; stjärnan blir bara större. Det är toppen och slutet i Ägarens uppgift, där en liten belöning gör mest nytta.","fix":"När ett släpp korsar 50 eller landar på 100: en kort (300–400 ms) glimt i stjärnans sken och, vid 100, en tunn ring som tonar ut. Respektera prefers-reduced-motion. Ingen ljudeffekt, ingen konfetti.","selector":"svg g.scope","suggested":"later","suggestedWhy":"Polish efter att läsbarhet och layout är på plats.","pins":{"desktop":{"x":59.9,"y":78.5,"w":8.4,"h":4.1},"phone":{"x":64,"y":40.8,"w":12,"h":1.3}}},{"id":"projekt-milstolpe-ta-bort-utan-angra","view":"projekt","viewport":"desktop","title":"Ta bort Milstolpe sker direkt utan Ångra, till skillnad från Scope","severity":"P3","source":"critique","category":"consistency","theme":"Historik och återställning","why":"\"Ta bort\" på en Milstolpe t ion).","suggested":"fix","suggestedWhy":"Liten avslutning på uppgiftens topp; bekräftar också Signaturen."},{"id":"stilla-ord-varierar","view":"personer-all","viewport":null,"appliesTo":["stjarnkarta","personer"],"title":"Samma sak heter fyra olika saker","severity":"P3","source":"critique","category":"consistency","theme":"Status och stilla","why":"En Scope utan rörelse heter \"stilla > 14 d\" i Stjärnkartans siffror, \"21 d\" i nyckeln, \"Ingen rörelse på 21 dagar\" i kartan och \"1 stilla\" på Personer. \"stilla\" finns inte i GLOSSARY.md. Den som skannar lasten måste översätta mellan formerna.","fix":"Bestäm en term (t.ex. \"stilla\") och lägg in den i GLOSSARY.md; skriv \"1 stilla\" / \"stilla i 21 d\" konsekvent och behåll klartexten \"Ingen rörelse på 21 dagar\" bara i kartan. Byt \"stilla > 14 d\" mot \"stilla\" med förklaring i title eller i förklaringen.","suggested":"fix","suggestedWhy":"Textändringar plus en glossary-rad."},{"id":"stjarnkarta-bokstaver-svaga","view":"stjarnkarta","viewport":"desktop","selector":".key .glyph","title":"Projekt-bokstaven är brus med ett Projekt och svag i nyckeln","severity":"P3","source":"critique","category":"hierarchy","theme":"Stjärnkarta","why":"Med bara ett Projekt (Anna Lind) står ett \"A\" framför varje etikett utan att skilja något. Med flera Projekt är bokstaven bindningen mellan stjärna och nyckel, men i nyckeln är den 11 px och dämpad (--dim) medan den i kartan är 15 px – blicken hittar inte \"C\" i nyckeln.","fix":"Visa bokstäver först när fler än ett Projekt syns. I nyckeln: ge bokstaven samma storlek som Projektnamnet, gärna som en liten markering (ruta eller ring) så att den läses som en etikett.","suggested":"fix","suggestedWhy":"Liten ändring som stärker vyns kärnmekanism.","pin":{"x":69.3,"y":31.1,"w":1.1,"h":1.3},"mockup":{"after":"mockups/stjarnkarta-bokstaver-svaga/after.html"}},{"id":"stjarnkarta-drag-avslut","view":"stjarnkarta","viewport":null,"title":"Draget slutar utan att stjärnan bekräftar","sev     card.append(el('section', { class: 'part' }, el('h4', { class: 'lbl', text: T.why }), el('p', { text: f.why })));
    card.append(el('section', { class: 'part fix' }, el('h4', { class: 'lbl', text: T.fixL }), el('p', { text: f.fix })));
    if (f.appliesTo?.length) card.append(el('div', { class: 'applies' }, T.appliesTo, f.appliesTo.map(id => el('a', { href: '#' + anchor(id), class: 'tag', text: viewById(id) ? viewTitle(viewById(id)) : id }))));
    if (f.before) card.append(el('div', { class: 'pair' },
      el('figure', {}, el('figcaption', { text: T.before }), el('img', { src: f.before, alt: `${T.before}: ${f.title}`, loading: 'lazy' })),
      f.after ? el('figure', {}, el('figcaption', { text: T.now }), el('img', { src: f.after, alt: `${T.now}: ${f.title}`, loading: 'lazy' })) : null));
    if (f.question && questionById(f.question)) card.append(el('p', { class: 'qlink' }, `${T.decidedIn}: `, el('a', { href: '#q-' + f.question, text: questionById(f.question).question })));
    const extras = [
      f.mockup?.after ? mockupFold(`${T.showMockup} · ${T.after}`, f.mockup.after) : null,
      f.mockup?.before ? mockupFold(`${T.showMockup} · ${T.before}`, f.mockup.before) : null,
      f.rule ? el('details', { class: 'mini' }, el('summary', { text: `${T.ruleL} ${f.rule.ref ?? ''}`.trim() }),
        el('div', { class: 'rule' }, el('div', {}, el('b', { text: T.saysL }), f.rule.says), el('div', {}, el('b', { text: T.doesL }), f.rule.does))) : null,
    ].filter(Boolean);
    if (extras.length) card.append(el('div', { class: 'extras' }, extras));
    card.append(decideBlock(f, card));
    card.append(el('footer', { class: 'meta' }, [T[f.source] ?? f.source, f.category, f.alsoFlaggedBy?.length ? T.alsoFlagged + f.alsoFlaggedBy.join(', ') : null, f.id].filter(Boolean).join(' · ')));
    return card;
  }

  // The decision part of a finding card, rebuilt on its own so a decision never reloads the card's images.
  function decideBlock(f, card) {
    const d = decisions[f.id] ?? {}, cur = statusOf(f);
    const [note, addNote] = noteField('f:' + f.id, 'note-' + f.id, d.note, v => save(f.id, { note: v }));
    const foot = el('div', { class: 'decide-foot' }, el('span', {}),
      el('span', { class: 'foot-actions' }, addNote, cur && canWrite ? el('button', { class: 'link-btn', onclick: () => save(f.id, { status: null }) }, T.clear) : null,
        comments ? el('button', { class: 'link-btn', onclick: () => comments.openComposer({ element: card }).catch(() => {}) }, T.comment) : null));
    const block = el('section', { class: 'decide' },
      f.suggested ? el('div', { class: 'rec-line', style: `--dc:var(--d-${f.suggested})` },
        el('span', { class: 'rec-k', text: T.recHint.replace(/[:\s]+$/, '') }),
        el('span', { class: 'rec-v', text: T[f.suggested] }),
        f.suggestedWhy ? el('span', { class: 'rec-why', text: f.suggestedWhy }) : null) : null,
      el('div', { class: 'seg', role: 'group', 'aria-label': T.status }, STATUSES.map(k => el('button', { id: 's-' + f.id + '-' + k, type: 'button', class: k === f.suggested ? 'sugg' : '', style: `--dc:var(--d-${k})`, 'aria-pressed': String(cur === k), disabled: canWrite ? null : 'disabled', onclick: () => save(f.id, { status: k }) }, T[k]))),
      note, foot);
    whoLine(foot.firstChild, d);
    return block;
  }

  async function whoLine(span, d) {
    if (!d?.at) { span.textContent = ''; return; }
    let name = '';
    try { if (user && d.by) { const ps = await user.profiles([d.by]); name = ps[d.by]?.name || ''; } } catch {}
    span.textContent = `${name || T.someone} · ${new Date(d.at).toLocaleString(locale, { dateStyle: 'short', timeStyle: 'short' })}`;
  }

  async function write(coll, id, cur, patch) {
    if (!db) return;
    const next = { ...cur, ...patch, by: me, at: new Date().toISOString() };
    try { await db.collection(coll).doc(id).set(next); }
    catch (e) { showBanner(e?.code === 'not_granted' ? T.readOnly : T.notSaved); }
  }
  const save = (id, patch) => write('decisions', id, { status: decisions[id]?.status ?? null, note: decisions[id]?.note ?? '' }, patch);
  const saveAnswer = (id, patch) => write('answers', id, { option: answers[id]?.option ?? null, note: answers[id]?.note ?? '' }, patch);

  function showBanner(t) { const b = $('#banner'); b.textContent = t; b.hidden = false; }

  function drift() {
    const rows = D.findings.filter(f => f.rule);
    if (!rows.length) return;
    $('#drift-sec').hidden = false; $('#drift-h').textContent = T.drift;
    const t = $('#drift');
    t.append(el('tr', {}, [T.aspect, T.view, T.says, T.does, T.ref].map(h => el('th', { text: h }))));
    for (const f of [...rows].sort((a, b) => (a.category ?? '').localeCompare(b.category ?? ''))) t.append(el('tr', {}, el('td', { text: f.category ?? '' }), el('td', { class: 'mono', text: viewById(f.view) ? viewTitle(viewById(f.view)) : f.view }), el('td', { text: f.rule.says }), el('td', { text: f.rule.does }), el('td', { class: 'mono', text: f.rule.ref ?? '' })));
  }

  function renderAll() { summary(); questions(); render(); }
  overview(); heat(); controls(); drift(); renderAll();

  // After a decision, update the cards in place. Only filters that hide decided items need a full render.
  function refresh() {
    if (state.open || state.status !== 'all') { keepPlace(renderAll); return; }
    keepPlace(() => {
      summary();
      for (const q of D.questions ?? []) {
        const card = document.getElementById('q-' + q.id); if (!card) continue;
        const cur = optionOf(q);
        card.classList.toggle('answered', !!cur);
        card.querySelectorAll('.opt').forEach((o, i) => {
          const on = cur === q.options[i].key, b = o.querySelector('.pick');
          o.classList.toggle('chosen', on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? T.chosen : T.choose;
        });
        const note = card.querySelector('textarea'); if (note !== document.activeElement) note.value = answers[q.id]?.note ?? '';
        whoLine(card.querySelector('.decide-foot').firstChild, answers[q.id]);
      }
      for (const f of D.findings) {
        const card = document.getElementById('f-' + f.id);
        card?.querySelector('.decide').replaceWith(decideBlock(f, card));
      }
    });
  }

  function listen(coll, store) {
    db.collection(coll).onSnapshot(snap => {
      for (const k of Object.keys(store)) delete store[k];
      for (const doc of snap.docs) if (doc.exists) store[doc.id] = doc.data();
      if (document.activeElement?.tagName === 'TEXTAREA') { pending = true; summary(); return; }
      refresh();
    }, () => showBanner(T.loadFail));
  }

  (async () => {
    const c = window.claude; if (!c?.use) { showBanner(T.offline); return; }
    const [d, u, cm] = await Promise.all([c.use('db'), c.use('user'), c.use('comments')]);
    user = u; comments = cm;
    if (!d) { showBanner(T.signedOut); renderAll(); return; }
    db = d;
    try { me = u ? await u.id() : null; } catch {}
    canWrite = true;
    try { if (u && (await u.can?.('data.write')) === false) canWrite = false; } catch {}
    if (!canWrite) showBanner(T.readOnly);
    renderAll();
    listen('decisions', decisions);
    listen('answers', answers);
  })();
})();
</script>
